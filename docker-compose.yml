services:
  app:
    build: .
    container_name: services_prod
    restart: unless-stopped
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: miapp_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
